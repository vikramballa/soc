[project]
name = "sentinelx"
version = "0.1.0"
description = "SentinelX — open-source SOC platform: correlated, explainable, evidence-grounded incidents"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "structlog>=24.4",
    "prometheus-client>=0.20",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "joblib>=1.4",
    "typer>=0.12",
    "email-validator>=2.3.0",
]

[project.scripts]
sentinelx = "sentinelx.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pysigma>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = ["ignore::DeprecationWarning:sklearn.*"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "SIM", "RUF"]
ignore = ["S101", "S311", "B008", "RUF012", "S608", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "ASYNC240"]
"migrations/**" = ["E501"]
# prose prompts and HTML templates
"src/sentinelx/ai/prompt.py" = ["E501"]
"src/sentinelx/reports/incident_report.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
