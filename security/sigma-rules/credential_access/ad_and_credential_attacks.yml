title: Kerberoasting - Service Ticket With RC4 Encryption
id: 4e73eaf0-2c4c-4464-95e4-d8a6d5c79f66
name: kerberoast_rc4_ticket
status: stable
description: A Kerberos service ticket was issued with RC4 encryption for a user (not computer) service account. Kerberoasting tools request RC4 tickets because they crack offline far faster than AES ones.
author: SentinelX
date: 2026-11-05
references:
  - https://attack.mitre.org/techniques/T1558/003/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4769
    TicketEncryptionType: '0x17'
    Status: '0x0'
  filter_machine:
    ServiceName|endswith: '$'
  filter_krbtgt:
    ServiceName: krbtgt
  condition: selection and not 1 of filter_*
falsepositives:
  - Legacy applications that only support RC4
level: high
tags:
  - attack.credential_access
  - attack.t1558.003
---
title: Many Kerberos Service Tickets Requested by One Account
id: a100968c-ee66-49eb-9be2-6571f89062f6
status: stable
description: One account received five or more RC4 service tickets within 10 minutes - typical of a tool roasting every service account in the domain.
author: SentinelX
date: 2026-11-05
correlation:
  type: event_count
  rules:
    - kerberoast_rc4_ticket
  group-by:
    - username
  timespan: 10m
  condition:
    gte: 5
  generate: true
falsepositives:
  - Vulnerability scanners authenticating to many services
level: critical
tags:
  - attack.credential_access
  - attack.t1558.003
---
title: AS-REP Roasting - TGT Requested Without Pre-Authentication
id: c7049dcc-f03d-4ee3-a4f1-12536ffff1ff
status: stable
description: A Kerberos ticket-granting ticket was issued to an account that does not require pre-authentication, using RC4. Attackers request these to crack the account password offline.
author: SentinelX
date: 2026-11-05
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4768
    TicketEncryptionType: '0x17'
    PreAuthType: '0'
  condition: selection
falsepositives:
  - Legacy accounts deliberately configured without pre-authentication
level: high
tags:
  - attack.credential_access
  - attack.t1558.004
---
title: DCSync - Directory Replication Requested by a Non-Computer Account
id: 3de357c8-52a7-44a5-b664-1cbcde381389
status: stable
description: An account asked a domain controller to replicate directory secrets (the DS-Replication-Get-Changes rights). Only domain controllers should do this; tools such as Mimikatz DCSync use it to pull every password hash.
author: SentinelX
date: 2026-11-05
references:
  - https://attack.mitre.org/techniques/T1003/006/
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4662
    Properties|contains:
      - '1131f6aa-9c07-11d1-f79f-00c04fc2dcd2'
      - '1131f6ad-9c07-11d1-f79f-00c04fc2dcd2'
      - '89e95b76-444d-4c62-991a-0facbeda640c'
  filter_machine:
    SubjectUserName|endswith: '$'
  condition: selection and not filter_machine
falsepositives:
  - Azure AD Connect / Entra Connect sync accounts (add them as exceptions)
level: critical
tags:
  - attack.credential_access
  - attack.t1003.006
---
title: DCSync Seen on the Network (DRSGetNCChanges)
id: 46353f89-e764-4a15-90c0-0c160774e94c
status: stable
description: Zeek observed a DRSUAPI GetNCChanges replication call. Between domain controllers this is normal; from a workstation or server it means someone is pulling password hashes.
author: SentinelX
date: 2026-11-05
logsource:
  product: zeek
  service: dce_rpc
detection:
  selection:
    operation: DRSGetNCChanges
  condition: selection
falsepositives:
  - Replication between domain controllers (exclude DC addresses)
level: high
tags:
  - attack.credential_access
  - attack.t1003.006
---
title: Kerberos RC4 Service Ticket on the Network
id: efe826c5-dc04-43b7-88df-9fc0b8502007
status: stable
description: Zeek observed a Kerberos service-ticket exchange using the weak RC4 cipher, a network view of Kerberoasting.
author: SentinelX
date: 2026-11-05
logsource:
  product: zeek
  service: kerberos
detection:
  selection:
    request_type: TGS
    cipher|contains: rc4
  filter:
    service|startswith: krbtgt
  condition: selection and not filter
falsepositives:
  - Legacy systems without AES support
level: medium
tags:
  - attack.credential_access
  - attack.t1558.003
---
title: LSASS Memory Opened for Reading
id: db01a6e4-2550-4fde-8f38-9098102abd27
status: stable
description: A process opened lsass.exe with memory-read rights. Credential dumpers (Mimikatz, procdump, comsvcs MiniDump) do this to steal password hashes and tickets.
author: SentinelX
date: 2026-11-05
logsource:
  category: process_access
  product: windows
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1438'
      - '0x143a'
      - '0x1fffff'
      - '0x40'
  filter_system:
    SourceImage|endswith:
      - '\MsMpEng.exe'
      - '\wininit.exe'
      - '\csrss.exe'
      - '\svchost.exe'
      - '\taskmgr.exe'
  condition: selection and not filter_system
falsepositives:
  - Endpoint security and backup products
level: high
tags:
  - attack.credential_access
  - attack.t1003.001
---
title: Registry Hive Saved (SAM / SECURITY / SYSTEM)
id: c5d69f83-8f17-4ec5-a3dd-927c28f26ce8
status: stable
description: The SAM, SECURITY or SYSTEM hive was exported with reg.exe. With these files local password hashes and cached domain credentials can be extracted offline.
author: SentinelX
date: 2026-11-05
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool:
    Image|endswith: '\reg.exe'
    CommandLine|contains:
      - ' save '
      - ' export '
  selection_hive:
    CommandLine|contains:
      - 'hklm\sam'
      - 'hklm\security'
      - 'hklm\system'
      - 'hkey_local_machine\sam'
      - 'hkey_local_machine\security'
      - 'hkey_local_machine\system'
  condition: all of selection_*
falsepositives:
  - Backup scripts (rare)
level: high
tags:
  - attack.credential_access
  - attack.t1003.002
---
title: Active Directory Database Copied (NTDS.dit)
id: 7e8b4a38-cf79-4f65-a207-f3fb9ffa1a56
status: stable
description: ntdsutil created an install-from-media copy, or a command copied ntds.dit from a shadow copy. The NTDS database holds every domain password hash.
author: SentinelX
date: 2026-11-05
logsource:
  category: process_creation
  product: windows
detection:
  selection_ntdsutil:
    CommandLine|contains|all:
      - 'ntdsutil'
      - 'ifm'
  selection_copy:
    CommandLine|contains|all:
      - 'ntds.dit'
      - 'HarddiskVolumeShadowCopy'
  condition: 1 of selection_*
falsepositives:
  - Planned domain controller promotion from media
level: critical
tags:
  - attack.credential_access
  - attack.t1003.003
---
title: Credential Dumping Tool Keywords on the Command Line
id: 54ce571c-0fe9-4d93-8158-4c18df1cf58d
status: stable
description: The command line contains keywords of well-known credential theft tools (Mimikatz, Rubeus, secretsdump, LaZagne).
author: SentinelX
date: 2026-11-05
logsource:
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - 'sekurlsa::'
      - 'lsadump::'
      - 'kerberos::golden'
      - 'kerberos::ptt'
      - 'privilege::debug'
      - 'Invoke-Mimikatz'
      - 'Rubeus.exe kerberoast'
      - 'Rubeus.exe asreproast'
      - 'Rubeus.exe asktgt'
      - 'secretsdump.py'
      - 'lazagne.exe'
  condition: selection
falsepositives:
  - Authorised penetration tests
level: critical
tags:
  - attack.credential_access
  - attack.t1003
---
title: Linux Password Hashes Read
id: e1250e16-f805-4b9d-856a-086ef03014f8
status: stable
description: A command read /etc/shadow or copied it, outside of normal password tools.
author: SentinelX
date: 2026-11-05
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    CommandLine|contains:
      - '/etc/shadow'
      - '/etc/gshadow'
  filter:
    Image|endswith:
      - '/passwd'
      - '/chpasswd'
      - '/usermod'
      - '/useradd'
      - '/pwck'
  condition: selection and not filter
falsepositives:
  - Configuration management audits
level: high
tags:
  - attack.credential_access
  - attack.t1003.008
---
title: Browser or Credential Store Files Accessed by a Script
id: 2481c67c-ca85-47ff-9282-20d6c3512ffb
status: stable
description: A command referenced browser saved-password databases or Windows credential vault files.
author: SentinelX
date: 2026-11-05
logsource:
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - '\Login Data'
      - '\Microsoft\Credentials\'
      - '\Microsoft\Vault\'
      - 'logins.json'
      - 'key4.db'
  filter_browsers:
    Image|endswith:
      - '\chrome.exe'
      - '\msedge.exe'
      - '\firefox.exe'
  condition: selection and not filter_browsers
falsepositives:
  - Browser profile backup tools
level: high
tags:
  - attack.credential_access
  - attack.t1555
