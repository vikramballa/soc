title: Security Agent or Sensor Service Stopped
id: b9abddc0-ce6a-4921-a7ad-fd67fa28d6c8
status: stable
description: A command stopped, disabled or killed a security agent or sensor (Wazuh, Sysmon, Suricata, Zeek, auditd, Defender, EDR). Attackers blind monitoring before they act.
author: SentinelX
date: 2026-11-05
logsource:
  category: process_creation
detection:
  selection_verb:
    CommandLine|contains:
      - 'stop '
      - 'disable '
      - ' kill'
      - 'taskkill'
      - 'Stop-Service'
      - 'Set-Service'
      - 'delete '
      - 'mask '
  selection_target:
    CommandLine|contains:
      - 'wazuh'
      - 'ossec'
      - 'sysmon'
      - 'suricata'
      - 'zeek'
      - 'auditd'
      - 'WinDefend'
      - 'MsMpEng'
      - 'falcon'
      - 'osquery'
      - 'filebeat'
      - 'fluent-bit'
  selection_tool:
    Image|endswith:
      - '\sc.exe'
      - '\net.exe'
      - '\net1.exe'
      - '\taskkill.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '/systemctl'
      - '/service'
      - '/kill'
      - '/pkill'
      - '/killall'
  condition: all of selection_*
falsepositives:
  - Planned agent upgrades (pair with a maintenance window)
level: high
tags:
  - attack.defense_impairment
  - attack.t1685
  - attack.impact
  - attack.t1489
