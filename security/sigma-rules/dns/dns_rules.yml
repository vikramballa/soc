title: Unusually Long DNS Label
id: ed921ac4-d8e3-4b86-ab23-cbfeced24a5c
status: stable
description: A DNS query contains a label of 40+ characters, a pattern used by DNS tunneling and data exfiltration tools.
author: SentinelX
date: 2026-10-06
logsource:
  category: dns
detection:
  selection:
    QueryName|re: '(^|\.)[A-Za-z0-9_-]{40,}\.'
  condition: selection
falsepositives:
  - Some CDN and anti-virus cloud lookups use long labels
level: medium
tags:
  - attack.command_and_control
  - attack.t1071.004
  - attack.exfiltration
  - attack.t1048.003
