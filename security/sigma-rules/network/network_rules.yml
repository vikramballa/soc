title: Unanswered Connection Attempt
id: 4f70ce0e-84e8-4e87-b1a5-1fd8fa0e933b
name: connection_attempt
status: stable
description: A connection attempt that was rejected or never answered. Not alerting on its own; feeds scan detection.
author: SentinelX
date: 2026-10-06
logsource:
  category: network_connection
detection:
  selection:
    event_action: connection_attempt
  condition: selection
level: informational
tags:
  - attack.discovery
---
title: Port Scan From a Single Source
id: dc564229-306b-4f88-90cb-8e65e321657d
status: stable
description: One source tried twenty or more different ports on the same target within 2 minutes.
author: SentinelX
date: 2026-10-06
correlation:
  type: value_count
  rules:
    - connection_attempt
  group-by:
    - src_ip
    - dest_ip
  timespan: 2m
  condition:
    field: dest_port
    gte: 20
falsepositives:
  - Authorized vulnerability scanners
level: medium
tags:
  - attack.discovery
  - attack.t1046
---
title: Network Host Sweep
id: 10df1b94-50a6-4b30-8c23-aa5470d9e1fc
status: stable
description: One source attempted connections to fifteen or more different hosts within 5 minutes.
author: SentinelX
date: 2026-10-06
correlation:
  type: value_count
  rules:
    - connection_attempt
  group-by:
    - src_ip
  timespan: 5m
  condition:
    field: dest_ip
    gte: 15
falsepositives:
  - Asset discovery / monitoring tools
level: medium
tags:
  - attack.discovery
  - attack.t1018
