title: IDS Scan Signature
id: 0be9ccd7-7daa-4b33-8dad-d553200d611a
status: stable
description: Suricata or Zeek reported scanning activity.
author: SentinelX
date: 2026-10-06
logsource:
  category: ids_alert
detection:
  suricata:
    rule_name|contains:
      - 'ET SCAN'
      - 'GPL SCAN'
  zeek:
    rule_id|startswith: 'Scan::'
  condition: suricata or zeek
falsepositives:
  - Authorized scanners
level: medium
tags:
  - attack.reconnaissance
  - attack.t1595
  - attack.discovery
  - attack.t1046
