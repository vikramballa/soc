title: Outbound Connection to Uncommon Port
id: a68b24c9-5f0f-4016-8815-3f68fd15d6dc
status: stable
description: A host connected to an external address on a port commonly used by remote-access tools and reverse shells.
author: SentinelX
date: 2026-10-06
logsource:
  category: network_connection
detection:
  selection:
    DestinationPort:
      - 4444
      - 1337
      - 31337
      - 6666
      - 6667
      - 5555
      - 9001
      - 2222
  internal_dest:
    - DestinationIp|cidr: '10.0.0.0/8'
    - DestinationIp|cidr: '172.16.0.0/12'
    - DestinationIp|cidr: '192.168.0.0/16'
    - DestinationIp|cidr: '127.0.0.0/8'
  attempt:
    event_action: connection_attempt
  condition: selection and not internal_dest and not attempt
falsepositives:
  - Developer tools or games using these ports
level: high
tags:
  - attack.command_and_control
  - attack.t1571
---
title: Large Outbound Data Transfer
id: 0966d318-cb2a-4072-948f-1f24cbbb194d
status: stable
description: A single connection sent more than 50 MB to an external address.
author: SentinelX
date: 2026-10-06
logsource:
  category: network_connection
detection:
  selection:
    bytes_out|gte: 50000000
  internal_dest:
    - DestinationIp|cidr: '10.0.0.0/8'
    - DestinationIp|cidr: '172.16.0.0/12'
    - DestinationIp|cidr: '192.168.0.0/16'
  condition: selection and not internal_dest
falsepositives:
  - Backups or uploads to sanctioned cloud storage
level: medium
tags:
  - attack.exfiltration
  - attack.t1048
