title: SentinelX Retention or Correlation Exclusions Changed
id: dfc9d0a9-897b-4bdd-aab2-b0ee3499d2db
status: stable
description: Event retention or the list of entities excluded from correlation was changed. Shorter retention destroys evidence; exclusions can hide an attacker's hosts.
author: SentinelX
date: 2026-11-05
logsource:
  product: sentinelx_platform
detection:
  selection:
    event_action: tenant.settings
    changed:
      - event_retention_days
      - correlation_ignore
  condition: selection
falsepositives:
  - Planned storage or tuning change
level: medium
tags:
  - attack.stealth
  - attack.t1070
---
