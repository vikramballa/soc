title: Certutil Used to Download or Decode a File
id: 274f0e90-4dd8-4f39-a7ce-d702d3fb95ae
status: stable
description: certutil.exe fetched a URL or decoded a base64 file. Attackers use this signed Windows tool to bring in payloads past application allow-lists.
author: SentinelX
date: 2026-11-05
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\certutil.exe'
    CommandLine|contains:
      - 'urlcache'
      - 'verifyctl'
      - '-decode'
      - '/decode'
  condition: selection
falsepositives:
  - Rare administrative certificate tasks
level: high
tags:
  - attack.command_and_control
  - attack.t1105
  - attack.stealth
  - attack.t1140
---
title: Signed Windows Binary Running Remote or Inline Script
id: 8cbf08f2-3dfe-4bc5-b550-c8c5a7a77d58
status: stable
description: mshta, rundll32 or regsvr32 was told to run script from a URL or inline JavaScript - proxy execution through trusted Windows binaries.
author: SentinelX
date: 2026-11-05
logsource:
  category: process_creation
  product: windows
detection:
  selection_mshta:
    Image|endswith: '\mshta.exe'
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'javascript:'
      - 'vbscript:'
  selection_rundll32:
    Image|endswith: '\rundll32.exe'
    CommandLine|contains:
      - 'javascript:'
      - 'RunHTMLApplication'
      - 'http://'
      - 'https://'
  selection_regsvr32:
    Image|endswith: '\regsvr32.exe'
    CommandLine|contains:
      - 'scrobj.dll'
      - '/i:http'
      - '-i:http'
  condition: 1 of selection_*
falsepositives:
  - Very old intranet applications
level: high
tags:
  - attack.stealth
  - attack.t1218.005
  - attack.t1218.011
  - attack.t1218.010
