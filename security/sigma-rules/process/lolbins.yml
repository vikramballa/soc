title: BITS Job Used to Download a File
id: 764e8352-ab45-49bc-86e9-3d410695d3f7
status: stable
description: bitsadmin or Start-BitsTransfer downloaded a file. BITS transfers survive reboots and are a known stealthy download channel.
author: SentinelX
date: 2026-11-05
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    CommandLine|contains:
      - 'bitsadmin /transfer'
      - 'bitsadmin.exe /transfer'
      - '/addfile'
      - 'Start-BitsTransfer'
  condition: selection
falsepositives:
  - Some software updaters
level: medium
tags:
  - attack.persistence
  - attack.t1197
  - attack.command_and_control
  - attack.t1105
---
title: Reverse Shell Command Line
id: 5399d4c7-230a-47ef-ba9a-cb3b5d3520f6
status: stable
description: The command line matches common reverse-shell one-liners (bash /dev/tcp, netcat -e, python pty spawn, socat exec). These give a remote operator an interactive shell.
author: SentinelX
date: 2026-11-05
logsource:
  category: process_creation
detection:
  selection:
    CommandLine|contains:
      - '/dev/tcp/'
      - '/dev/udp/'
      - 'nc -e '
      - 'ncat -e '
      - 'nc.traditional -e'
      - 'pty.spawn('
      - 'socat exec:'
      - 'socat tcp-connect'
      - 'mkfifo /tmp/'
  condition: selection
falsepositives:
  - Penetration tests
level: critical
tags:
  - attack.execution
  - attack.t1059.004
  - attack.command_and_control
---
title: PowerShell Download Cradle
id: a2b47f18-d84a-4b61-8750-2573c894f33c
status: stable
description: PowerShell downloaded and ran code in memory (IEX with WebClient / Invoke-WebRequest / DownloadString).
author: SentinelX
date: 2026-11-05
logsource:
  category: process_creation
detection:
  selection_dl:
    CommandLine|contains:
      - 'DownloadString('
      - 'DownloadData('
      - 'Invoke-WebRequest'
      - 'Net.WebClient'
  selection_exec:
    CommandLine|contains:
      - 'IEX'
      - 'Invoke-Expression'
  condition: all of selection_*
falsepositives:
  - Install scripts (e.g. Chocolatey bootstrap)
level: high
tags:
  - attack.execution
  - attack.t1059.001
  - attack.command_and_control
  - attack.t1105
